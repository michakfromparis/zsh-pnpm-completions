name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write  # Required for OIDC/trusted publishing
  contents: write  # Required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install zsh for shell validation
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check package.json
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"

      - name: Check if version already exists on npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "❌ Version $PACKAGE_VERSION already exists on npm. Please update the version in package.json first."
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is available for publishing"
          fi

      - name: Resolve release tag
        id: release
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish

      - name: Success notification
        if: success()
        run: |
          echo "✅ Successfully published $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") to npm"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Failed to publish to npm"
          exit 1
